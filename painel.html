<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Painel de Pedidos - Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
    h1 { margin-bottom: 15px; }
    .pedido { background: #fff; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-left: 6px solid #ccc; }
    .pedido.novo { border-left-color: #3498db; }
    .pedido.preparando { border-left-color: #f39c12; }
    .pedido.pronto { border-left-color: #2ecc71; }
    .pedido.entregue { border-left-color: #95a5a6; }
    .pedido.lido { opacity: 0.6; background: #f8f8f8; }
    .linha { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px inset #f9f9f9; padding-bottom: 4px; }
    .detalhes { font-size: 0.9em; color: #555; background: #fefefe; padding: 8px; border-radius: 4px; }
    .itens-lista { margin: 10px 0; padding-left: 20px; }
    .btn { padding: 8px 12px; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; margin-right: 5px; transition: 0.2s; }
    .btn:hover { opacity: 0.8; }
    .btn-print { background: #000; color: #fff; }
    .btn-status { background: #95a5a6; color: #fff; padding: 5px 10px; font-size: 11px; }
    .btn-status.novo { background: #3498db; }
    .btn-status.preparando { background: #f39c12; }
    .btn-status.pronto { background: #2ecc71; }
    .btn-status.entregue { background: #95a5a6; }
    .status { font-weight: bold; color: #2ecc71; }
    .endereco { font-style: italic; color: #333; margin: 5px 0; display: block; }
    .botoes-status { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px; }
  </style>
</head>
<body>

<h1>📦 Pedidos Recebidos</h1>
<div id="lista-pedidos">Carregando pedidos...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Criar cliente Supabase se não existir (compatível com index.js)
  let supabase_client = window.supabase_client || window.supabase.createClient(
    "https://hrryboxebcrlvwlyydnn.supabase.co",
    "sb_publishable_1ykTwghNLzY3nKKdeLE7Rg_zEHqrJbR"
  );

  async function carregarPedidos() {
    const { data, error } = await supabase_client
      .from("pedidos")
      .select("*")
      .order("data_criacao", { ascending: false });

    if (error) {
      console.error("Erro ao carregar pedidos:", error.message);
      document.getElementById("lista-pedidos").innerHTML = `<p style="color: red;"><strong>Erro ao carregar dados:</strong> ${error.message}</p>`;
      return;
    }

    if (!data || data.length === 0) {
      document.getElementById("lista-pedidos").innerHTML = "<p style='color: #999;'>Nenhum pedido registrado ainda.</p>";
      return;
    }

    const container = document.getElementById("lista-pedidos");
    container.innerHTML = "";

    data.forEach(p => {
      const div = document.createElement("div");
      const statusClass = p.status || 'novo';
      
      // Verifica se o pedido foi marcado como lido no localStorage
      const foiLido = localStorage.getItem(`pedido-lido-${p.id}`) === 'true';
      const classeDiv = foiLido ? `pedido lido` : `pedido ${statusClass}`;
      
      div.className = classeDiv;

      // Lógica para listar os itens formatados
      let htmlItens = "";
      if (Array.isArray(p.itens)) {
        p.itens.forEach(item => {
          htmlItens += `<li>${item.qtd}x ${item.nome} - R$ ${Number(item.total).toFixed(2)}</li>`;
        });
      }

      const dataCriacao = p.data_criacao ? new Date(p.data_criacao).toLocaleString("pt-BR") : "Data não disponível";

      div.innerHTML = `
        <div class="linha">
          <strong>🆔 ${p.pedido_id}</strong>
          <span class="status">${foiLido ? '👁️ LIDO' : (p.status || 'NOVO').toUpperCase()}</span>
        </div>

        <div class="detalhes">
          <strong>👤 Cliente:</strong> ${p.nome_cliente || 'Não informado'}<br>
          <strong>📍 Endereço:</strong> <span class="endereco">${p.endereco || 'Não informado'}</span>
          ${p.numero_casa ? `<strong>Nº:</strong> ${p.numero_casa}<br>` : ''}
          ${p.bairro ? `<strong>Bairro:</strong> ${p.bairro}<br>` : ''}
          <strong>💳 Pagamento:</strong> ${p.pagamento || 'Não informado'}
        </div>

        <ul class="itens-lista">
          ${htmlItens || "<li>Sem itens registrados</li>"}
        </ul>

        <div class="linha">
          <span><strong>TOTAL: R$ ${Number(p.total).toFixed(2)}</strong></span>
          <small>${dataCriacao}</small>
        </div>

        <div style="text-align: right; margin-top: 10px;">
          <button class="btn btn-print" onclick="imprimirPedido('${p.id}')">
            🖨 Imprimir Cupom
          </button>
          <button class="btn" style="background: #9b59b6; color: #fff;" onclick="marcarComoLido('${p.id}')">
            ${foiLido ? '👁️ Marcar como Não Lido' : '📖 Marcar como Lido'}
          </button>
        </div>

        <div class="botoes-status">
          <button class="btn btn-status novo" onclick="atualizarStatus('${p.id}', 'novo')">📨 Novo</button>
          <button class="btn btn-status preparando" onclick="atualizarStatus('${p.id}', 'preparando')">👨‍🍳 Preparando</button>
          <button class="btn btn-status pronto" onclick="atualizarStatus('${p.id}', 'pronto')">✅ Pronto</button>
          <button class="btn btn-status entregue" onclick="atualizarStatus('${p.id}', 'entregue')">🚚 Entregue</button>
        </div>
      `;

      container.appendChild(div);
    });
  }

  function marcarComoLido(pedidoId) {
    const estavaLido = localStorage.getItem(`pedido-lido-${pedidoId}`) === 'true';
    if (estavaLido) {
      localStorage.removeItem(`pedido-lido-${pedidoId}`);
    } else {
      localStorage.setItem(`pedido-lido-${pedidoId}`, 'true');
    }
    carregarPedidos();
  }

  async function atualizarStatus(pedidoId, novoStatus) {
    const { data, error } = await supabase_client
      .from("pedidos")
      .update({ status: novoStatus })
      .eq("id", pedidoId);

    if (error) {
      console.error("Erro ao atualizar status:", error.message);
      alert("Erro ao atualizar status do pedido");
      return;
    }

    console.log(`Pedido ${pedidoId} atualizado para: ${novoStatus}`);
    carregarPedidos(); // Recarrega a lista
  }

  function imprimirPedido(id) {
    window.open(`print.html?id=${id}`, "_blank");
  }

  // Recarrega a cada 30 segundos automaticamente
  setInterval(carregarPedidos, 30000);
  carregarPedidos();
</script>
</body>
</html>
